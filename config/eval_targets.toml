[run] # configuration parameters that targets may not override, always the same for every run
width = 1280
height = 720
fps = 30
duration = 1800
interval = 2
godot_env = { BRAWLER_AUTOPLAY = "ai:7", BRAWLER_RULES = "timed:2400" }

[defaults] # targets may override these
godot_warmup = 12
obs_warmup = 28

[[target]] # per target settings, defaults don't make sense
name = "local-mac"
role = "debug"
host = "local"
emulated = true

[[target]]
name = "hetzner-cpx31"
role = "measure"
host = "ssh://bench@203.0.113.10"
provider = "hetzner"
obs_warmup = 40
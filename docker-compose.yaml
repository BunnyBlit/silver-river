services:
  mediamtx:
    image: bluenviron/mediamtx:${MEDIAMTX_TAG}
    ports:
      - "1935:1935"   # RTMP ingest -- the benchmark streams here instead of Twitch
      - "8888:8888"   # HLS playback, handy for eyeballing the test stream in a browser
    restart: unless-stopped

  benchmark:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UBUNTU_TAG: ${UBUNTU_TAG}
        GODOT_VERSION: ${GODOT_VERSION}
        GODOT_RELEASE: ${GODOT_RELEASE}
        DOTNET_SDK: ${DOTNET_SDK}
        PYTHON_VERSION: ${PYTHON_VERSION}
        UV_VERSION: ${UV_VERSION}
        OBS_APT_VERSION: ${OBS_APT_VERSION}
    platform: linux/amd64
    depends_on:
      - mediamtx
    environment:
      - SR_OBS_PASSWORD=${SR_OBS_PASSWORD:?set SR_OBS_PASSWORD}
      - SR_AGD_COMMIT=${SR_AGD_COMMIT:?export SR_AGD_COMMIT (git describe --always --dirty)}
    volumes:
      - ${AGD_REPO:?set AGD_REPO to the BrawlerAGD-Godot checkout}:/bench/godot-project:ro
      - ./benchmark_results:/bench/benchmark_results
      - nuget-cache:/root/.nuget/packages
    env_file:
      - targets/shared.env
      - targets/${TARGET:?set TARGET to a file in targets/}.env
    

volumes:
  nuget-cache:
    